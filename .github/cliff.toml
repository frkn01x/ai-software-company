# git-cliff — Conventional Commits'den otomatik changelog üretir
[changelog]
header = "# Değişiklik Günlüğü\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (**BREAKING**) {% endif %}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat",     group = "✨ Yeni Özellikler" },
  { message = "^fix",      group = "🐛 Hata Düzeltmeleri" },
  { message = "^perf",     group = "⚡ Performans" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^test",     group = "🧪 Testler" },
  { message = "^docs",     group = "📝 Dokümantasyon" },
  { message = "^chore",    group = "🔧 Bakım" },
  { message = "^ci",       group = "👷 CI/CD" },
  { message = "^security", group = "🔒 Güvenlik" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
